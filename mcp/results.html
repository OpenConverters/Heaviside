<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Heaviside results</title>
    <style>
      :root {
        --fg: #1c1f24; --muted: #6b7280; --line: #d7dbe0; --card: rgba(0,0,0,.04);
        --accent: #1d6fd8; --pass: #1a7f4b; --warn: #a4680a; --fail: #b3261e;
        --chosen: rgba(29,111,216,.10);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e7e9ee; --muted: #9aa3b0; --line: #333a44; --card: rgba(255,255,255,.06);
          --accent: #5aa9ff; --pass: #52c98a; --warn: #e0a83a; --fail: #ff7a70;
          --chosen: rgba(90,169,255,.14);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: transparent; color: var(--fg);
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #app { padding: 10px 12px 12px; }
      .pad { padding: 14px 2px; }
      h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
      .head { margin-bottom: 8px; }
      .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .muted { color: var(--muted); }
      .err {
        background: rgba(255,93,85,.12); border-radius: 6px;
        padding: 8px 10px; font-size: 12.5px;
      }
      .tbl { width: 100%; border-collapse: collapse; }
      .tbl th {
        text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px;
        border-bottom: 1px solid var(--line); padding: 5px 7px; white-space: nowrap;
      }
      .tbl td { padding: 6px 7px; border-bottom: 1px solid var(--line); vertical-align: top; }
      .row { cursor: pointer; }
      .row:hover { background: var(--card); }
      .row.chosen { background: var(--chosen); }
      .status { font-weight: 620; font-size: 12px; }
      .status.pass { color: var(--pass); }
      .status.warn { color: var(--warn); }
      .status.fail { color: var(--fail); }
      .act { text-align: right; white-space: nowrap; }
      .btn {
        font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer;
        color: var(--fg); background: transparent;
        border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px;
      }
      .btn:hover { border-color: var(--accent); color: var(--accent); }
      .btn.chosen { background: var(--accent); border-color: var(--accent); color: #fff; }
      .detailrow > .detail { background: var(--card); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 5px; }
      .chip {
        font-size: 11px; border-radius: 4px; padding: 1.5px 6px;
        border: 1px solid var(--line); color: var(--muted);
      }
      .diags { margin: 8px 0 0; padding-left: 16px; color: var(--warn); font-size: 12px; }
      .diags li { margin-bottom: 3px; }
      .hint { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/results.js"></script>
  </body>
</html>
